                     <fieldset>

                     <legend>Contact Form</legend>
                   <p> 
                    <label for="firstname" class="name"> First Name</label>

                    <label for="female" class="female"> Female</label>
                    <input type="radio" id="female" name="gender" value="female" required>

                   </p>
                   <p>
                    <label for="age" class="age"> What's your age? </label>

                   </p>
                   <p>

                    <br>
                    <br>
                    <textarea id="message" name="message" placeholder="Write your message here..." rows="5"
                    cols="60" ></textarea>
                   </p>
